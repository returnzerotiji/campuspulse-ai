services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campuspulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuspulse
      POSTGRES_PASSWORD: campuspulse
      POSTGRES_DB: campuspulse
    ports:
      - "5432:5432"
    volumes:
      - campuspulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  campuspulse_db_data:
